name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install linters
        run: pip install ruff black
      - name: Ruff check
        run: ruff check src/ tests/ configs/
      - name: Black check
        run: black --check src/ tests/ configs/

  test:
    name: Tests (CPU, synthetic data)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests (no GPU, no slow)
        run: pytest -m "not gpu and not slow" -q --tb=short

  config-validate:
    name: Config validation (Hydra compose)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install package
        run: pip install -e .
      - name: Validate all configs
        run: python -m cdlib.cli.validate_configs
