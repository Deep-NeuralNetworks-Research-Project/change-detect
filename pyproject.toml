[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdlib"
version = "0.1.0"
description = "Pair-Order Consistent & Uncertainty-Aware Semantic Change Detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ekanayake"},
    {name = "Lelwala"},
    {name = "Pabasara"},
    {name = "Bulagala"},
    {name = "Rajapaksha"},
]

dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "torchgeo>=0.6",
    "torchmetrics>=1.0",
    "segmentation-models-pytorch>=0.3",
    "timm>=0.9",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.15",
    "numpy>=1.24",
    "Pillow>=9.0",
    "opencv-python-headless>=4.8",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "albumentations>=1.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "black>=24.0",
    "pre-commit>=3.0",
    "nbstripout>=0.6",
    "ipykernel>=6.0",
]
modal = [
    "modal>=0.73",
]

[project.scripts]
cdlib-train = "cdlib.cli.train:main"
cdlib-evaluate = "cdlib.cli.evaluate:main"
cdlib-benchmark = "cdlib.cli.benchmark:main"
cdlib-export-masks = "cdlib.cli.export_masks:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "modal_app.py", "train.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: marks tests that require a GPU (deselect with '-m \"not gpu\"')",
    "slow: marks tests that are slow (deselect with '-m \"not slow\"')",
    "ffmpeg: requires ffmpeg with libx264",
]
addopts = "-v --tb=short"
